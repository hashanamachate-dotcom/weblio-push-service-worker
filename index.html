<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weblio Firebase Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 30px 15px;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
      color: #555;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 7px;
      background: #f3f4f6;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Weblio Firebase Test</h1>

  <p>
    This is a temporary diagnostic page.
    It tests Firebase Cloud Messaging from the Vercel deployment.
  </p>

  <button id="testButton">
    Test Firebase
  </button>

  <div id="status">
    Ready.
  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getMessaging,
    getToken
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";


  /*
   * FIREBASE CONFIG
   */

  const firebaseConfig = {

    apiKey:
      "AIzaSyD5XhPV7yGhrCPUiYj3TSWuHF8OVWVAcXk",

    authDomain:
      "weblio-push-hub-64689.firebaseapp.com",

    projectId:
      "weblio-push-hub-64689",

    storageBucket:
      "weblio-push-hub-64689.firebasestorage.app",

    messagingSenderId:
      "240629203108",

    appId:
      "1:240629203108:web:38e2e2d1f9884cefef2631",

    measurementId:
      "G-ME77G36Z4S"

  };


  /*
   * VAPID PUBLIC KEY
   */

  const VAPID_KEY =
    "BG9DxwA_SjkCNwr2qA46gMq6QfeaFuKp3aX9PSindEqEAG-KbzqsKvmqWx3sBm8mlWoyHZs-Z5b1NU5uU49_dnQ";


  const button =
    document.getElementById("testButton");

  const status =
    document.getElementById("status");


  function showStatus(message) {

    status.textContent = message;

    console.log(message);

  }


  button.addEventListener(
    "click",
    async function() {

      button.disabled = true;

      showStatus(
        "STEP 1: Initializing Firebase..."
      );


      try {

        /*
         * STEP 1
         */

        const app =
          initializeApp(firebaseConfig);


        console.log(
          "Firebase app initialized:",
          app
        );


        showStatus(
          "STEP 1 PASSED\n\n" +
          "Firebase initialized successfully.\n\n" +
          "STEP 2: Checking browser support..."
        );


        /*
         * STEP 2
         */

        if (!("Notification" in window)) {

          throw new Error(
            "This browser does not support notifications."
          );

        }


        if (!("serviceWorker" in navigator)) {

          throw new Error(
            "This browser does not support service workers."
          );

        }


        showStatus(
          "STEP 1 PASSED\n\n" +
          "STEP 2 PASSED\n\n" +
          "Browser supports notifications and service workers.\n\n" +
          "STEP 3: Registering service worker..."
        );


        /*
         * STEP 3
         */

        const registration =
          await navigator.serviceWorker.register(
            "/firebase-messaging-sw.js",
            {
              scope: "/"
            }
          );


        console.log(
          "Service worker registration:",
          registration
        );


        await navigator.serviceWorker.ready;


        console.log(
          "Service worker is ready."
        );


        showStatus(
          "STEP 1 PASSED\n\n" +
          "STEP 2 PASSED\n\n" +
          "STEP 3 PASSED\n\n" +
          "Service worker registered successfully.\n\n" +
          "STEP 4: Requesting notification permission..."
        );


        /*
         * STEP 4
         */

        const permission =
          await Notification.requestPermission();


        console.log(
          "Notification permission:",
          permission
        );


        if (permission !== "granted") {

          throw new Error(
            "Notification permission was not granted. " +
            "Current permission: " +
            permission
          );

        }


        showStatus(
          "STEP 1 PASSED\n\n" +
          "STEP 2 PASSED\n\n" +
          "STEP 3 PASSED\n\n" +
          "STEP 4 PASSED\n\n" +
          "Notification permission granted.\n\n" +
          "STEP 5: Initializing Firebase Messaging..."
        );


        /*
         * STEP 5
         */

        const messaging =
          getMessaging(app);


        console.log(
          "Firebase Messaging initialized:",
          messaging
        );


        showStatus(
          "STEP 1 PASSED\n\n" +
          "STEP 2 PASSED\n\n" +
          "STEP 3 PASSED\n\n" +
          "STEP 4 PASSED\n\n" +
          "STEP 5 PASSED\n\n" +
          "Firebase Messaging initialized.\n\n" +
          "STEP 6: Requesting FCM token..."
        );


        /*
         * STEP 6
         */

        const token =
          await getToken(
            messaging,
            {
              vapidKey: VAPID_KEY,
              serviceWorkerRegistration:
                registration
            }
          );


        if (!token) {

          throw new Error(
            "Firebase returned an empty FCM token."
          );

        }


        console.log(
          "FCM TOKEN:",
          token
        );


        showStatus(
          "🎉 SUCCESS\n\n" +
          "Firebase successfully created an FCM token.\n\n" +
          "The Vercel → Firebase connection is working.\n\n" +
          "FCM Token:\n\n" +
          token
        );


        button.textContent =
          "Firebase Test Passed";


      } catch (error) {

        console.error(
          "FIREBASE TEST ERROR:",
          error
        );


        showStatus(
          "❌ TEST FAILED\n\n" +
          error.toString() +
          "\n\n" +
          "Check the browser Console (F12) for details."
        );


        button.disabled = false;

        button.textContent =
          "Test Firebase Again";

      }

    }
  );

</script>

</body>
</html>
