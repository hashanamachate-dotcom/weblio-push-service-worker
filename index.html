<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weblio Tutor Notifications</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.4;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .info {
      background: #eff6ff;
      color: #1e40af;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔔 Weblio Tutor Notifications</h1>

  <p class="description">
    Enable browser notifications to receive important Weblio updates.
  </p>

  <form id="notificationForm">

    <label for="tutorId">
      Tutor ID
    </label>

    <input
      type="text"
      id="tutorId"
      placeholder="Enter your Tutor ID"
      required
    >

    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      required
    >

    <button
      type="submit"
      id="enableButton"
    >
      Enable Notifications
    </button>

  </form>

  <div
    id="status"
    class="status"
  ></div>

</div>


<script type="module">

  /*
   * ==========================================
   * FIREBASE IMPORTS
   * ==========================================
   */

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getMessaging,
    getToken
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";


  /*
   * ==========================================
   * FIREBASE CONFIGURATION
   * ==========================================
   *
   * This is the NEW API key that successfully
   * generated an FCM token from Vercel.
   */

  const firebaseConfig = {

    apiKey:
      "AIzaSyD5XhPV7yGhrCPUiYj3TSWuHF8OVWVAcXk",

    authDomain:
      "weblio-push-hub-64689.firebaseapp.com",

    projectId:
      "weblio-push-hub-64689",

    storageBucket:
      "weblio-push-hub-64689.firebasestorage.app",

    messagingSenderId:
      "240629203108",

    appId:
      "1:240629203108:web:38e2e2d1f9884cefef2631",

    measurementId:
      "G-ME77G36Z4S"

  };


  /*
   * ==========================================
   * FIREBASE VAPID PUBLIC KEY
   * ==========================================
   */

  const VAPID_KEY =
    "BG9DxwA_SjkCNwr2qA46gMq6QfeaFuKp3aX9PSindEqEAG-KbzqsKvmqWx3sBm8mlWoyHZs-Z5b1NU5uU49_dnQ";


  /*
   * ==========================================
   * GOOGLE APPS SCRIPT REGISTRY
   * ==========================================
   */

  const REGISTRY_URL =
    "https://script.google.com/macros/s/AKfycbzdgH_gwN_j6h2-xUIB5oECq1wCctEHLRm5HKxW55cHkFaNhTHXSppkj0lcZCVzt3S5/exec";


  /*
   * ==========================================
   * PAGE ELEMENTS
   * ==========================================
   */

  const form =
    document.getElementById(
      "notificationForm"
    );

  const button =
    document.getElementById(
      "enableButton"
    );

  const status =
    document.getElementById(
      "status"
    );


  /*
   * ==========================================
   * STATUS MESSAGE
   * ==========================================
   */

  function showStatus(
    message,
    type
  ) {

    status.textContent =
      message;

    status.className =
      "status " + type;

    status.style.display =
      "block";

  }


  /*
   * ==========================================
   * SERVICE WORKER
   * ==========================================
   */

  async function registerServiceWorker() {

    if (
      !("serviceWorker" in navigator)
    ) {

      throw new Error(
        "This browser does not support service workers."
      );

    }


    /*
     * IMPORTANT:
     *
     * Vercel serves the service worker
     * from the root of the website.
     */

    const serviceWorkerUrl =
      "/firebase-messaging-sw.js";


    const registration =
      await navigator.serviceWorker.register(
        serviceWorkerUrl,
        {
          scope: "/"
        }
      );


    console.log(
      "Service worker registered:",
      registration
    );


    await navigator.serviceWorker.ready;


    console.log(
      "Service worker is ready."
    );


    return registration;

  }


  /*
   * ==========================================
   * FORM SUBMISSION
   * ==========================================
   */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const tutorId =
        document
          .getElementById("tutorId")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      /*
       * Validate fields
       */

      if (
        !tutorId ||
        !email
      ) {

        showStatus(
          "Please enter your Tutor ID and email address.",
          "error"
        );

        return;

      }


      /*
       * Disable button while processing
       */

      button.disabled =
        true;

      button.textContent =
        "Enabling Notifications...";


      try {

        /*
         * ======================================
         * STEP 1
         * Check notification support
         * ======================================
         */

        if (
          !("Notification" in window)
        ) {

          throw new Error(
            "This browser does not support web notifications."
          );

        }


        showStatus(
          "Preparing notification service...",
          "info"
        );


        /*
         * ======================================
         * STEP 2
         * Register service worker
         * ======================================
         */

        const registration =
          await registerServiceWorker();


        showStatus(
          "Requesting notification permission...",
          "info"
        );


        /*
         * ======================================
         * STEP 3
         * Request permission
         * ======================================
         */

        const permission =
          await Notification.requestPermission();


        if (
          permission !== "granted"
        ) {

          throw new Error(
            "Notification permission was not granted."
          );

        }


        showStatus(
          "Permission granted. Connecting to Firebase...",
          "info"
        );


        /*
         * ======================================
         * STEP 4
         * Initialize Firebase
         * ======================================
         */

        const app =
          initializeApp(
            firebaseConfig
          );


        const messaging =
          getMessaging(
            app
          );


        showStatus(
          "Creating notification registration...",
          "info"
        );


        /*
         * ======================================
         * STEP 5
         * Generate FCM token
         * ======================================
         */

        const token =
          await getToken(
            messaging,
            {
              vapidKey:
                VAPID_KEY,

              serviceWorkerRegistration:
                registration
            }
          );


        if (!token) {

          throw new Error(
            "Firebase did not return a notification token."
          );

        }


        console.log(
          "FCM token created:",
          token
        );


        showStatus(
          "Notification registration created. Saving...",
          "info"
        );


        /*
         * ======================================
         * STEP 6
         * Save registration to Apps Script
         * ======================================
         */

        await fetch(
          REGISTRY_URL,
          {
            method: "POST",

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain"
            },

            body:
              JSON.stringify({

                tutorId:
                  tutorId,

                email:
                  email,

                token:
                  token,

                permission:
                  permission

              })

          }
        );


        /*
         * ======================================
         * SUCCESS
         * ======================================
         */

        showStatus(
          "✅ Notifications have been enabled successfully!",
          "success"
        );


        button.textContent =
          "Notifications Enabled";


      } catch (error) {

        /*
         * ======================================
         * ERROR HANDLING
         * ======================================
         */

        console.error(
          "Notification registration error:",
          error
        );


        showStatus(
          "❌ " +
          error.message,
          "error"
        );


        button.disabled =
          false;

        button.textContent =
          "Enable Notifications";

      }

    }
  );

</script>

</body>
</html>
