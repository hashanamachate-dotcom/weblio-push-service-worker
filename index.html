<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weblio Tutor Notifications</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
      text-align: center;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.4;
    }

    .success {
      background: #ecfdf5;
      color: #065f46;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .info {
      background: #eff6ff;
      color: #1e40af;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔔 Weblio Tutor Notifications</h1>

  <p class="description">
    Enable browser notifications to receive important Weblio updates.
  </p>

  <form id="notificationForm">

    <label for="tutorId">Tutor ID</label>

    <input
      type="text"
      id="tutorId"
      placeholder="Enter your Tutor ID"
      required
    >

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      required
    >

    <button type="submit" id="enableButton">
      Enable Notifications
    </button>

  </form>

  <div id="status" class="status"></div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getMessaging,
    getToken
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";


  // NEW FIREBASE PROJECT

  const firebaseConfig = {

    apiKey: "AIzaSyDHa8Asn_C2YbNEpLdzQur5abUA_L5cI74",

    authDomain: "weblio-push-hub-64689.firebaseapp.com",

    projectId: "weblio-push-hub-64689",

    storageBucket: "weblio-push-hub-64689.firebasestorage.app",

    messagingSenderId: "240629203108",

    appId: "1:240629203108:web:38e2e2d1f9884cefef2631",

    measurementId: "G-ME77G36Z4S"

  };


  // NEW VAPID KEY

  const VAPID_KEY =
    "BG9DxwA_SjkCNwr2qA46gMq6QfeaFuKp3aX9PSindEqEAG-KbzqsKvmqWx3sBm8mlWoyHZs-Z5b1NU5uU49_dnQ";


  // APPS SCRIPT REGISTRY

  const REGISTRY_URL =
    "https://script.google.com/macros/s/AKfycbzdgH_gwN_j6h2-xUIB5oECq1wCctEHLRm5HKxW55cHkFaNhTHXSppkj0lcZCVzt3S5/exec";


  const app = initializeApp(firebaseConfig);

  const messaging = getMessaging(app);


  const form =
    document.getElementById("notificationForm");

  const button =
    document.getElementById("enableButton");

  const status =
    document.getElementById("status");


  function showStatus(message, type) {

    status.textContent = message;

    status.className =
      "status " + type;

    status.style.display = "block";

  }


  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    const tutorId =
      document.getElementById("tutorId")
        .value
        .trim();


    const email =
      document.getElementById("email")
        .value
        .trim();


    if (!tutorId || !email) {

      showStatus(
        "Please enter your Tutor ID and email address.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "Enabling Notifications...";


    try {

      if (!("Notification" in window)) {

        throw new Error(
          "This browser does not support web notifications."
        );

      }


      showStatus(
        "Requesting notification permission...",
        "info"
      );


      const permission =
        await Notification.requestPermission();


      if (permission !== "granted") {

        throw new Error(
          "Notification permission was not granted."
        );

      }


      showStatus(
        "Permission granted. Registering this browser...",
        "info"
      );


      const registration =
        await navigator.serviceWorker.register(
          "/weblio-push-service-worker/firebase-messaging-sw.js"
        );


      await navigator.serviceWorker.ready;


      showStatus(
        "Service worker ready. Creating notification registration...",
        "info"
      );


      const token =
        await getToken(messaging, {

          vapidKey: VAPID_KEY,

          serviceWorkerRegistration:
            registration

        });


      if (!token) {

        throw new Error(
          "Firebase did not return a notification token."
        );

      }


      showStatus(
        "Notification registration created. Saving...",
        "info"
      );


      await fetch(REGISTRY_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type": "text/plain"

        },

        body: JSON.stringify({

          tutorId: tutorId,

          email: email,

          token: token,

          permission: permission

        })

      });


      showStatus(
        "✅ Notifications have been enabled successfully!",
        "success"
      );


      button.textContent =
        "Notifications Enabled";


    } catch (error) {

      console.error(
        "Notification registration error:",
        error
      );


      showStatus(
        "❌ " + error.message,
        "error"
      );


      button.disabled = false;

      button.textContent =
        "Enable Notifications";

    }

  });

</script>

</body>
</html>
